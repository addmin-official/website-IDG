<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" 
     width="400" height="400" role="img" aria-label="Iraq Digital Gateway">
  <defs>
    <linearGradient id="idgArcSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19C7FF"/>
      <stop offset="100%" stop-color="#087BFF"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="52" fill="#06172B"/>
  
  <!-- Icon (large, centered top) -->
  <g transform="translate(150 55)">
    <path d="M 6 145 L 6 78 Q 6 6 50 6 Q 94 6 94 78 L 94 145"
          fill="none" stroke="url(#idgArcSq)" 
          stroke-width="14" stroke-linecap="round"/>
    <circle cx="50" cy="6" r="9" fill="#19C7FF"/>
  </g>
  
  <!-- IDG -->
  <text x="200" y="300" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="82" font-weight="900" letter-spacing="5"
        fill="#FFFFFF">IDG</text>
  
  <!-- Underline -->
  <rect x="155" y="318" width="90" height="5" rx="2.5" fill="url(#idgArcSq)"/>
  
  <!-- Subtitle -->
  <text x="200" y="350" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="11" font-weight="600" letter-spacing="3.5"
        fill="#D7E8F8">IRAQ DIGITAL GATEWAY</text>
</svg>
