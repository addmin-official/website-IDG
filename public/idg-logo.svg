<svg xmlns="http://www.w3.org/2000/svg"
     width="560" height="160" viewBox="0 0 560 160"
     role="img" aria-labelledby="idg-title idg-desc">

  <title id="idg-title">Iraq Digital Gateway</title>
  <desc id="idg-desc">
    Corporate logo representing a national digital gateway,
    secure connectivity and intelligent infrastructure.
  </desc>

  <defs>
    <linearGradient id="idg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18B7B0"/>
      <stop offset="100%" stop-color="#087E91"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="12" y="12" width="136" height="136"
        rx="28" fill="#0B172E"/>

  <!-- Gateway structure -->
  <path d="M43 119 V70
           C43 45 59 31 80 31
           C101 31 117 45 117 70
           V119"
        fill="none" stroke="url(#idg-gradient)"
        stroke-width="8" stroke-linecap="round"/>

  <!-- Inner gateway / digital pathway -->
  <path d="M62 119 V75
           C62 62 69 54 80 54
           C91 54 98 62 98 75
           V119"
        fill="none" stroke="#FFFFFF"
        stroke-width="5" stroke-linecap="round"/>

  <!-- National gold signal -->
  <path d="M53 95 H107"
        fill="none" stroke="#D97706"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Digital nodes -->
  <circle cx="43" cy="70" r="6" fill="#D97706"/>
  <circle cx="117" cy="70" r="6" fill="#D97706"/>
  <circle cx="80" cy="31" r="6" fill="#FFFFFF"/>
  <circle cx="80" cy="119" r="6" fill="#18B7B0"/>

  <!-- Wordmark -->
  <text x="174" y="66"
        font-family="Inter, system-ui, sans-serif"
        font-size="34" font-weight="800"
        letter-spacing="1.5" fill="#F1F5F9">
    IRAQ DIGITAL
  </text>

  <text x="174" y="103"
        font-family="Inter, system-ui, sans-serif"
        font-size="34" font-weight="800"
        letter-spacing="1.5" fill="#18B7B0">
    GATEWAY
  </text>

  <!-- Corporate descriptor -->
  <path d="M176 119 H218"
        stroke="#D97706" stroke-width="3"
        stroke-linecap="round"/>

  <text x="228" y="124"
        font-family="Inter, system-ui, sans-serif"
        font-size="11" font-weight="600"
        letter-spacing="2.1" fill="#64748B">
    CONNECT • SECURE • EMPOWER
  </text>

</svg>
