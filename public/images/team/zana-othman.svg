<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-zana-othman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A" />
      <stop offset="50%" stop-color="#0B172E" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="accent-zana-othman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <radialGradient id="glow-zana-othman" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#060D1A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-zana-othman" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#102447" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-zana-othman)" />
  <rect width="400" height="400" fill="url(#grid-zana-othman)" />
  <rect width="400" height="400" fill="url(#glow-zana-othman)" />

  <!-- Geometric Decorative Borders -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="200" cy="180" r="105" fill="#0B172E" stroke="#EA580C" stroke-width="2.5" />

  <!-- Stylized Portrait Silhouette -->
  <g transform="translate(145, 115)">
    <!-- Head -->
    <circle cx="55" cy="45" r="34" fill="url(#accent-zana-othman)" opacity="0.95" />
    <!-- Shoulders / Torso -->
    <path d="M 12 118 C 12 85, 30 75, 55 75 C 80 75, 98 85, 98 118 Z" fill="url(#accent-zana-othman)" opacity="0.9" />
    <!-- Institutional Accent Crest -->
    <circle cx="55" cy="45" r="38" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Monogram Initials Tag -->
  <g transform="translate(200, 310)">
    <rect x="-42" y="-18" width="84" height="36" rx="8" fill="#060D1A" stroke="#FDBA74" stroke-width="1.5" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ZO</text>
  </g>

  <!-- Corporate Sovereign Sub-badge -->
  <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#FDBA74" text-anchor="middle" letter-spacing="2">IRAQ DIGITAL GATEWAY</text>
</svg>