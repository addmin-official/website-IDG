<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A" />
      <stop offset="50%" stop-color="#0B172E" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow-ph" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060D1A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-ph" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#102447" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg-ph)" />
  <rect width="400" height="400" fill="url(#grid-ph)" />
  <rect width="400" height="400" fill="url(#glow-ph)" />

  <circle cx="200" cy="170" r="110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="170" r="90" fill="#0B172E" stroke="#102447" stroke-width="2" />

  <!-- Magnifying glass / search avatar -->
  <g transform="translate(160, 130)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="#F59E0B" stroke-width="5" />
    <line x1="56" y1="56" x2="80" y2="80" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Badge -->
  <g transform="translate(200, 310)">
    <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#060D1A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">OPEN ROLE</text>
  </g>

  <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">IDG TALENT PIPELINE</text>
</svg>